name: Release

# A tag v<semver> publishes the three artifacts under that version: the Python package to PyPI, the
# console image and the Helm chart to GHCR, and a GitHub release with notes. A pre-release tag
# (v1.0.0-rc.1) publishes a pre-release and no `latest` image tag. tools/version.py check guards
# that the tag is the version every file declares.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches the declared version; tests pass
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: azure/setup-helm@v4
      - id: version
        run: |
          python tools/version.py check --tag "$GITHUB_REF_NAME"
          semver="$(python tools/version.py semver)"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          case "$semver" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - run: python -m pip install --upgrade pip && python -m pip install -e ./python
      - run: python -m unittest discover -s python/tests -p 'test_*.py'
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build
        working-directory: console

  pypi:
    name: Python package to PyPI
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing: PyPI trusts this workflow, no token is stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist --wheel --outdir dist python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  image:
    name: Console image to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/midstream-console
          # v1.0.0-rc.1 -> 1.0.0-rc.1, the chart's appVersion; `latest` only for a release
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Midstream Console
            org.opencontainers.image.description=The web console of Midstream, a streaming platform on Kaspr
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: console
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package
        run: helm package charts/midstream --version "${{ needs.verify.outputs.semver }}" --app-version "${{ needs.verify.outputs.semver }}" --destination dist
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/midstream-${{ needs.verify.outputs.semver }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/

  github-release:
    name: GitHub release
    needs: [verify, pypi, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: |
            artifacts/python-distribution/*
            artifacts/helm-chart/*
