name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    name: One version everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/version.py check

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: azure/setup-helm@v4
      - name: Install the package in place
        run: python -m pip install --upgrade pip build && python -m pip install -e ./python
      - name: Unit tests
        run: python -m unittest discover -s python/tests -p 'test_*.py'
      - name: Syntax check
        run: python -m compileall -q python/src
      - name: Build the distribution
        run: python -m build --sdist --wheel --outdir dist python
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: python-distribution
          path: dist/

  console:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: console
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render with every values file
        run: |
          set -e
          for values in charts/midstream/ci/*.yaml; do
            echo "== $values"
            helm lint charts/midstream -f "$values"
            helm template midstream charts/midstream -n midstream -f "$values" > /dev/null
          done

  object-stores:
    name: Object stores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Throwaway keys for the job's own SeaweedFS and moto, which hold nothing.
      AWS_ACCESS_KEY_ID: midstream-ci
      AWS_SECRET_ACCESS_KEY: midstream-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Start SeaweedFS, Azurite and fake-gcs-server
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            chrislusf/seaweedfs:4.51 mini -dir=/data
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --inMemoryPersistence --skipApiVersionCheck --disableProductStyleUrl
          docker run -d --name fake-gcs-server -p 4443:4443 fsouza/fake-gcs-server:1.56.1 \
            -scheme http -port 4443 -public-host localhost:4443
      - name: Install the package and moto
        run: python -m pip install --upgrade pip && python -m pip install -e ./python 'moto[server]==5.2.5'
      - name: Start moto
        run: nohup moto_server -H 127.0.0.1 -p 5055 > moto.log 2>&1 &
      - name: Wait until every store answers
        run: |
          wait_for() {
            for attempt in $(seq 1 90); do
              if eval "$2" > /dev/null 2>&1; then echo "$1 answers"; return 0; fi
              sleep 1
            done
            echo "$1 did not answer within 90 seconds"
            return 1
          }
          # SeaweedFS's S3 gateway answers before its filer is ready: wait for a signed listing.
          wait_for SeaweedFS "python -c \"import boto3; boto3.client('s3', endpoint_url='http://localhost:8333', region_name='us-east-1').list_buckets()\""
          wait_for Azurite "curl -s -o /dev/null 'http://localhost:10000/devstoreaccount1?comp=list'"
          wait_for fake-gcs-server "curl -sf -o /dev/null http://localhost:4443/storage/v1/b"
          wait_for moto "curl -sf -o /dev/null http://localhost:5055/moto-api/"
      - name: SeaweedFS (s3://)
        env:
          STORAGE_S3_ENDPOINT: http://localhost:8333
          STORAGE_S3_PATH_STYLE: "true"
          STORAGE_LIVE_TESTS: s3://live-seaweedfs
          # SeaweedFS settles create-only writes racing for one key at about 0.6 s per writer: 6 rounds
          # of 16 racers take about a minute (20 take over three).
          STORAGE_LIVE_ROUNDS: "6"
        run: python -m unittest discover -s python/tests -p 'test_store_live.py' -v
      - name: moto (s3://)
        env:
          STORAGE_S3_ENDPOINT: http://localhost:5055
          STORAGE_S3_PATH_STYLE: "true"
          STORAGE_LIVE_TESTS: s3://live-moto
        run: python -m unittest discover -s python/tests -p 'test_store_live.py' -v
      - name: Azurite (abfss://)
        env:
          # Azurite's published development account and key, not a secret.
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;"
          STORAGE_LIVE_TESTS: abfss://live@devstoreaccount1.dfs.core.windows.net
        run: python -m unittest discover -s python/tests -p 'test_store_live.py' -v
      - name: fake-gcs-server (gs://)
        env:
          STORAGE_EMULATOR_HOST: http://localhost:4443
          STORAGE_LIVE_TESTS: gs://live-gcs
        run: python -m unittest discover -s python/tests -p 'test_store_live.py' -v
      - name: Emulator logs
        if: failure()
        run: |
          for name in seaweedfs azurite fake-gcs-server; do
            echo "== $name"; docker logs --tail 80 "$name" 2>&1 || true
          done
          echo "== moto"; tail -n 80 moto.log || true
