name: Dev images

# Every push to a branch of this repository publishes that commit's console image as
# ghcr.io/<owner>/midstream-console-dev:sha-<commit>, so a cluster can run a commit that is not
# released: the chart with package.source git and package.git.ref <commit>, and the console from
# this image (handbook 16 §16.3). linux/amd64 only. Releases are never built here: a tag builds them,
# through release.yml, into midstream-console. dev-images-prune.yml keeps the newest 50.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    name: Console dev image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/midstream-console-dev
          # sha-<the full commit>: the commit package.git.ref names
          tags: type=sha,format=long
          labels: |
            org.opencontainers.image.title=Midstream Console (development build)
            org.opencontainers.image.description=The Midstream console at one commit between releases; not a release
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: console
          platforms: linux/amd64
          push: true
          # One manifest per tag and no attestation index, so pruning a version leaves nothing behind
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
