[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "materializer-control-plane"
version = "4.4.1"
description = "Kaspr control plane for Kafka topic materialization"
requires-python = ">=3.12"
dependencies = [
	"jinja2>=3.1.0",
	"google-cloud-storage>=2.18.0",
	"kubernetes-asyncio>=33.1.0",
	"pyarrow>=18.1.0",
	# The minor is pinned: the committer uses documented-but-internal update APIs (lakehouse/catalog.py
	# `commit_once`, lakehouse/commits.py). The tests exercise them, so a new minor is a deliberate bump.
	"pyiceberg[pyarrow]>=0.12,<0.13",
	"pyyaml>=6.0.0",
	"tzdata>=2024.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"materializer_control_plane.runtime_app" = ["templates/*.j2"]