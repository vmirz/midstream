[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "midstream-platform"
version = "1.1.0"
description = "Midstream: a streaming platform on Kaspr that materializes Kafka topics into Iceberg tables"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["kafka", "iceberg", "kaspr", "streaming", "lakehouse"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: System :: Distributed Computing",
]
dependencies = [
	"jinja2>=3.1.0",
	"google-cloud-storage>=2.18.0",
	# The S3 store (lakehouse/store/s3.py): conditional PutObject (IfNoneMatch, IfMatch) and the default
	# integrity checksums it keeps are both in 1.36.
	"boto3>=1.36",
	# The Azure store (lakehouse/store/azure.py): from 12.31 a chunked upload names its blocks by uuid4;
	# up to 12.30 the ids came from offsets, and racing create-only chunked uploads committed mixed content.
	"azure-storage-blob>=12.31.0,<13",
	"azure-identity>=1.19",
	"kubernetes-asyncio>=33.1.0",
	"pyarrow>=18.1.0",
	# The minor is pinned: the committer uses documented-but-internal update APIs (lakehouse/catalog.py
	# `commit_once`, lakehouse/commits.py). The tests exercise them, so a new minor is a deliberate bump.
	"pyiceberg[pyarrow]>=0.12,<0.13",
	# Checking identity providers' ID tokens (RS256 and the like) for single sign-on.
	"PyJWT[crypto]>=2.10,<3",
	"pyyaml>=6.0.0",
	"tzdata>=2024.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"midstream.runtime_app" = ["templates/*.j2"]

[project.urls]
Homepage = "https://github.com/vmirz/midstream"
Repository = "https://github.com/vmirz/midstream"
Documentation = "https://github.com/vmirz/midstream/tree/main/docs/handbook"
Changelog = "https://github.com/vmirz/midstream/releases"
