namePrefix: develop-

resources:
  - ./../base

patches:
  - target:
      kind: KasprApp
      name: materializer-control-plane
    patch: |-
      - op: replace
        path: /spec/pythonPackages/packages/0
        value: git+https://github.com/vmirz/midstream.git@develop#egg=midstream&subdirectory=python
      - op: replace
        path: /spec/template/kasprContainer/env
        value:
          - name: MATERIALIZER_CONTROL_PLANE_DEFAULT_NAMESPACE
            value: midstream
          - name: MATERIALIZER_CONTROL_PLANE_DEFAULT_LIST_LIMIT
            value: "30"
          - name: MATERIALIZER_CONTROL_PLANE_DELETED_RETENTION_HOURS
            value: "24"
          - name: MATERIALIZER_CONTROL_PLANE_DEFAULT_RUNTIME_STORAGE_SIZE
            value: 64Mi
          - name: MATERIALIZER_CONTROL_PLANE_DEFAULT_RUNTIME_REPLICAS
            value: "1"
          # The gs:// prefix every materialization's tables are created under.
          - name: MATERIALIZER_CONTROL_PLANE_DEFAULT_DESTINATION_URI
            value: ""
          - name: MATERIALIZER_CONTROL_PLANE_RUNTIME_NAME_PREFIX
            value: develop
          - name: MATERIALIZER_CONTROL_PLANE_RUNTIME_TEMPLATE_VERSION
            value: v1
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: /app/gcp/google_application_credentials.json
          - name: MATERIALIZER_CONTROL_PLANE_RUNTIME_APP_SPEC
            value: |-
              replicas: 16
              bootstrapServers: crs-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
              authentication:
                type: scram-sha-512
                username: materializer-control-plane-user
                passwordSecret:
                  secretName: materializer-control-plane-user
                  passwordKey: password
              storage:
                type: persistent-claim
                class: default
                size: 64Mi
                deleteClaim: true
              # Two cores let a seal run beside the worker (handbook 12 §12.10); the members request what
              # they use, resized in place (handbook 02 §2.10c).
              resources:
                requests:
                  cpu: 0.5
                  memory: 1Gi
                limits:
                  cpu: 2
                  memory: 1Gi
              verticalPodAutoscaler:
                enabled: true
                updateMode: InPlaceOrRecreate
                controlledResources: [cpu]
                controlledValues: RequestsOnly
                minAllowed:
                  cpu: 100m
                maxAllowed:
                  cpu: 1500m
              config:
                brokerRebalanceTimeout: 300
              pythonPackages:
                packages:
                  - git+https://github.com/vmirz/midstream.git@develop#egg=midstream&subdirectory=python
              template:
                pod:
                  nodeSelector:
                    app: sipapi
                  tolerations:
                    - effect: NoSchedule
                      key: app
                      operator: Equal
                      value: twmapp
                  volumes:
                    - name: github-ssh
                      secret:
                        defaultMode: 256
                        secretName: github-deploy-key
                        items:
                          - key: id_ed25519
                            path: id_ed25519
                          - key: known_hosts
                            path: known_hosts
                    - name: gcp-credentials
                      secret:
                        secretName: kafka-materializer-gcp-credentials
                        items:
                          - key: google_application_credentials.json
                            path: google_application_credentials.json
                pythonPackagesInitContainer:
                  env:
                    - name: GIT_SSH_COMMAND
                      value: >-
                        ssh -i /var/run/secrets/github-ssh/id_ed25519
                        -o IdentitiesOnly=yes
                        -o UserKnownHostsFile="/tmp/github_known_hosts /var/run/secrets/github-ssh/known_hosts"
                        -o StrictHostKeyChecking=accept-new
                  volumeMounts:
                    - name: github-ssh
                      mountPath: /var/run/secrets/github-ssh
                      readOnly: true
                kasprContainer:
                  env:
                    - name: MATERIALIZER_RUNTIME_MEMBER_ID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                    - name: GOOGLE_APPLICATION_CREDENTIALS
                      value: /app/gcp/google_application_credentials.json
                    - name: MATERIALIZER_PROTOCOL_LOGGING_ENABLED
                      value: "true"                      
                  volumeMounts:
                    - name: gcp-credentials
                      mountPath: /app/gcp
                      readOnly: true
          - name: MATERIALIZER_CONTROL_PLANE_MATERIALIZATION_REQUESTS_TOPIC
            value: develop-materialization-requests
          - name: MATERIALIZER_CONTROL_PLANE_MATERIALIZATION_WORK_TOPIC
            value: develop-materialization-work
          - name: MATERIALIZER_CONTROL_PLANE_MATERIALIZATION_STATUS_TOPIC
            value: develop-materialization-status
          - name: MATERIALIZER_CONTROL_PLANE_SCHEMA_AUTHORITY_UPDATES_TOPIC
            value: develop-materialization-schema-authority-updates
          - name: MATERIALIZER_CONTROL_PLANE_TABLE_EVENTS_TOPIC
            value: develop-materialization-table-events
          - name: MATERIALIZER_CONTROL_PLANE_STORAGE_PREFIX
            value: develop
          - name: MATERIALIZER_CONTROL_PLANE_SETTINGS_REQUESTS_TOPIC
            value: develop-materializer-settings-requests
          - name: MATERIALIZER_CONTROL_PLANE_IDENTITY_REQUESTS_TOPIC
            value: develop-materializer-identity-requests
          # Sign-in, from this environment's own Secret, so a session from one environment is
          # never accepted by another.
          - name: MATERIALIZER_AUTH_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: develop-materializer-auth
                key: signing-key
                optional: true
          - name: MATERIALIZER_AUTH_PREVIOUS_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: develop-materializer-auth
                key: previous-signing-key
                optional: true
          - name: MATERIALIZER_AUTH_SERVICE_TOKEN
            valueFrom:
              secretKeyRef:
                name: develop-materializer-auth
                key: service-token
                optional: true
          - name: MATERIALIZER_AUTH_BOOTSTRAP_ADMIN_EMAIL
            valueFrom:
              secretKeyRef:
                name: develop-materializer-auth
                key: bootstrap-admin-email
                optional: true
          - name: MATERIALIZER_AUTH_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: develop-materializer-auth
                key: bootstrap-admin-password
                optional: true
          - name: MATERIALIZER_PROTOCOL_LOGGING_ENABLED
            value: "true"
  # The tail app: its own KasprApp, agent, task and WebViews, on this environment's topics, calling
  # this environment's control plane with this environment's service credential.
  - target:
      kind: KasprApp
      name: materializer-tail
    patch: |-
      - op: replace
        path: /spec/pythonPackages/packages/0
        value: git+https://github.com/vmirz/midstream.git@develop#egg=midstream&subdirectory=python
      - op: replace
        path: /spec/template/kasprContainer/env/1/value
        value: develop-materializer-tail
      - op: replace
        path: /spec/template/kasprContainer/env/2/value
        value: http://develop-materializer-control-plane-app-api:6065
      - op: replace
        path: /spec/template/kasprContainer/env/3/valueFrom/secretKeyRef/name
        value: develop-materializer-auth
      - op: replace
        path: /spec/template/kasprContainer/env/4/value
        value: develop-materialization-table-events
      - op: replace
        path: /spec/template/kasprContainer/env/5/value
        value: develop-materializer-tail-requests
  - target:
      kind: KasprAgent
      labelSelector: kaspr.io/app=materializer-tail
    patch: |-
      - op: add
        path: /metadata/labels/kaspr.io~1app
        value: develop-materializer-tail
  - target:
      kind: KasprTask
