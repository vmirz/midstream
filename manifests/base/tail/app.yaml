# The tail app: the newest records of every materialization's tables, read from Kafka before they
# are committed, for the console (handbook 19). The control plane ticks every table each minute on
# `materializer-tail-requests`, keyed by table, so each table is owned by the member Kaspr gives its
# partition; any member answers any request and forwards what is another's. A table is read only
# while someone is watching it. Nothing is persisted: a member rebuilds what it holds from the
# ticks, the control plane, the table events and Kafka.
apiVersion: kaspr.io/v1alpha1
kind: KasprApp
metadata:
  name: materializer-tail
  namespace: midstream
  labels:
    app.kubernetes.io/name: materializer-tail
spec:
  # Up to 64, the tick topic's partitions; two for availability (handbook 19 §19.9 sizes it).
  replicas: 2
  bootstrapServers: crs-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  authentication:
    type: scram-sha-512
    username: materializer-control-plane-user
    passwordSecret:
      secretName: materializer-control-plane-user
      passwordKey: password
  # Kaspr's own: the app keeps no table of its own.
  storage:
    type: persistent-claim
    class: default
    size: 1Gi
    deleteClaim: True
  config:
    valueSerializer: json
    topicAllowDeclare: true
    webBasePath: /
    webPort: 6065
  # Ingest is Python on one core, about 5,000 records a second; the buffers are bounded by the
  # memory budget below, 2.5 GiB, leaving room for the process, the fetches and the answers.
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  # The CPU request follows use, resized in place: a member nobody watches needs little. The limits
  # stay the ceilings and memory stays as set (handbook 02 §2.10c).
  verticalPodAutoscaler:
    enabled: true
    updateMode: InPlaceOrRecreate
    controlledResources: [cpu]
    controlledValues: RequestsOnly
    minAllowed:
      cpu: 100m
    maxAllowed:
      cpu: 1500m
  pythonPackages:
    packages:
      - git+https://github.com/vmirz/midstream.git@main#egg=materializer-control-plane&subdirectory=python
    installPolicy:
      retries: 3
      timeout: 600
      onFailure: block
  template:
    pod:
      nodeSelector:
        app: sipapi
      tolerations:
        - effect: NoSchedule
          key: app
          operator: Equal
          value: twmapp
      volumes:
        - name: github-ssh
          secret:
            defaultMode: 256
            secretName: github-deploy-key
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
        - name: gcp-credentials
          secret:
            secretName: kafka-materializer-gcp-credentials
            items:
              - key: google_application_credentials.json
                path: google_application_credentials.json
    pythonPackagesInitContainer:
      env:
        - name: GIT_SSH_COMMAND
          value: >-
            ssh -i /var/run/secrets/github-ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="/tmp/github_known_hosts /var/run/secrets/github-ssh/known_hosts"
            -o StrictHostKeyChecking=accept-new
      volumeMounts:
        - name: github-ssh
          mountPath: /var/run/secrets/github-ssh
          readOnly: true
    kasprContainer:
      env:
        # Names the member in its answers, logs and the members view.
        - name: MATERIALIZER_RUNTIME_MEMBER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MATERIALIZER_TAIL_APP_NAME
          value: materializer-tail
        # Session checks and schema fetches.
        - name: MATERIALIZER_TAIL_CONTROL_PLANE_URL
          value: http://materializer-control-plane-app-api:6065
        # The read-only service credential: schema fetches, and the console's own credential every
        # request must carry. The control plane's, from the same Secret.
        - name: MATERIALIZER_TAIL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: materializer-auth
              key: service-token
              optional: true
        - name: MATERIALIZER_TAIL_TABLE_EVENTS_TOPIC
          value: materialization-table-events
        - name: MATERIALIZER_TAIL_REQUESTS_TOPIC
          value: materializer-tail-requests
        # Resident buffer bytes across every table before retained records are dropped and the
        # largest table pauses: 2.5 GiB of the 4 GiB limit.
        - name: MATERIALIZER_TAIL_MEMORY_BUDGET_BYTES
          value: "2684354560"
        # The fallback seed reads a table through its pointer when the control plane cannot answer.
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/gcp/google_application_credentials.json
        - name: MATERIALIZER_PROTOCOL_LOGGING_ENABLED
          value: "true"
      volumeMounts:
        - name: gcp-credentials
          mountPath: /app/gcp
          readOnly: true
