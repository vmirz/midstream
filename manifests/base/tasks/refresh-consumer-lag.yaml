apiVersion: kaspr.io/v1alpha1
kind: KasprTask
metadata:
  name: refresh-consumer-lag
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: refresh-consumer-lag
  description: Ask the maintenance agent to refresh consumer-group lag for active materializations.
  onLeader: true
  schedule:
    cron: "*/1 * * * *"
  processors:
    pipeline:
      - build-lag-trigger
      - send-lag-trigger
    init:
      python: |
        from datetime import UTC, datetime

        from materializer_control_plane.handlers.maintenance import build_consumer_lag_refresh_trigger

        def current_timestamp():
            return datetime.now(tz=UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
    operations:
      - name: build-lag-trigger
        map:
          entrypoint: build_trigger
          python: |
            def build_trigger():
                return build_consumer_lag_refresh_trigger(requested_at=current_timestamp())
      - name: send-lag-trigger
        topicSend:
          name: materialization-work
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from materializer_control_plane.storage import materialization_routing_key

                  return materialization_routing_key(value["materialization_id"])
          valueSelector:
            python: |
              def select_value(value):
                  return value
