apiVersion: kaspr.io/v1alpha1
kind: KasprTask
metadata:
  name: purge-deleted-materializations
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: purge-deleted-materializations
  description: Ask the maintenance agent to permanently remove materializations deleted beyond the retention window.
  onLeader: true
  schedule:
    cron: "17 * * * *"
  processors:
    pipeline:
      - build-purge-trigger
      - send-purge-trigger
    init:
      python: |
        from datetime import UTC, datetime

        from midstream.handlers.maintenance import build_purge_deleted_trigger

        def current_timestamp():
            return datetime.now(tz=UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
    operations:
      - name: build-purge-trigger
        map:
          entrypoint: build_trigger
          python: |
            def build_trigger():
                return build_purge_deleted_trigger(requested_at=current_timestamp())
      - name: send-purge-trigger
        topicSend:
          name: materialization-work
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage import materialization_routing_key

                  return materialization_routing_key(value["materialization_id"])
          valueSelector:
            python: |
              def select_value(value):
                  return value
