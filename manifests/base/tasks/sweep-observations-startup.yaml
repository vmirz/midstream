apiVersion: kaspr.io/v1alpha1
kind: KasprTask
metadata:
  name: sweep-observations-startup
  namespace: kafka-sql
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: sweep-observations-startup
  description: Emit a best-effort startup trigger that asks the observation agent to scan for stale runtimes.
  onLeader: true
  processors:
    pipeline:
      - build-sweep-trigger
      - send-sweep-trigger
    init:
      python: |
        from datetime import UTC, datetime

        from materializer_control_plane.handlers.resource_observation import build_sweep_observation_trigger

        def current_timestamp():
            return datetime.now(tz=UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
    operations:
      - name: build-sweep-trigger
        map:
          entrypoint: build_trigger
          python: |
            def build_trigger():
                return build_sweep_observation_trigger(
                    requested_at=current_timestamp(),
                    task_id="sweep-observations-startup-task",
                )
      - name: send-sweep-trigger
        topicSend:
          name: materialization-work
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from materializer_control_plane.storage import materialization_routing_key

                  return materialization_routing_key(value["materialization_id"])
          valueSelector:
            python: |
              def select_value(value):
                  return value
