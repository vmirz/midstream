apiVersion: kaspr.io/v1alpha1
kind: KasprTask
metadata:
  name: identity-bootstrap
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: identity-bootstrap
  description: At startup, ask the identity agent to store the built-in groups and make sure an administrator exists.
  onLeader: true
  processors:
    pipeline:
      - build-bootstrap-request
      - send-bootstrap-request
    init:
      python: |
        from datetime import UTC, datetime

        from midstream.handlers.identity import build_identity_bootstrap_request

        def current_timestamp():
            return datetime.now(tz=UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
    operations:
      - name: build-bootstrap-request
        map:
          entrypoint: build_request
          python: |
            def build_request():
                return build_identity_bootstrap_request(requested_at=current_timestamp())
      - name: send-bootstrap-request
        topicSend:
          name: materializer-identity-requests
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value
