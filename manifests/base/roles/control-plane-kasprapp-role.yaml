apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: materializer-control-plane-kasprapp-manager
  namespace: kafka-sql
rules:
  - apiGroups:
      - kaspr.io
    resources:
      - kasprapps
      - kasprtables
      - kaspragents
      - kasprtasks
    verbs:
      - get
      - create
      - patch
      - delete
  # Each runtime member's pod, for how often it restarts and why (handbook 08 §8.3, row 3d).
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
