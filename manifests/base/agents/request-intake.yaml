apiVersion: kaspr.io/v1alpha1
kind: KasprAgent
metadata:
  name: request-intake
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  description: Accepts materialization requests, turns them into bounded control-plane work, and claims and releases their tables' names in the directory.
  input:
    topic:
      name: materialization-requests
      valueSerializer: json
    declare: true
  output:
    topics:
      # The workflow's next step, keyed by the materialization.
      - name: materialization-work
        valueSerializer: json
        keySelector:
          python: |
            def select_key(value):
                return value["key"]
        valueSelector:
          python: |
            def select_value(value):
                return value["value"]
        predicate:
          python: |
            def should_send(value):
                return value is not None and value.get("route") == "work"
      # Claims and releases of table names, for the directory's agent: on the one key every
      # identity request shares, so they apply in order.
      - name: materializer-identity-requests
        valueSerializer: json
        keySelector:
          python: |
            def select_key(value):
                from midstream.storage.identity import identity_routing_key

                return identity_routing_key()
        valueSelector:
          python: |
            def select_value(value):
                return value["value"]
        predicate:
          python: |
            def should_send(value):
                return value is not None and value.get("route") == "identity"
  processors:
    pipeline:
      - route-request
    init:
      python: |
        from midstream.handlers.request_intake import handle_request_event_for_output
    operations:
      - name: route-request
        tables:
          - name: state
            paramName: control_plane_table
          - name: settings
            paramName: settings_table
        map:
          entrypoint: route_request
          python: |
            # Returns a generator over the outputs, already computed: Kaspr sends each one it
            # yields, and would send a list as a single value.
            def route_request(value, control_plane_table, settings_table):
                return handle_request_event_for_output(
                    value,
                    control_plane_table,
                    settings_table=settings_table,
                )