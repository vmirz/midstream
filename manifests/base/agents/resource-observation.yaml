apiVersion: kaspr.io/v1alpha1
kind: KasprAgent
metadata:
  name: resource-observation
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  description: Inspects KasprApp resources once per work item and optionally reschedules bounded follow-up observation.
  input:
    topic:
      name: materialization-work
      valueSerializer: json
    declare: true
  output:
    topics:
      - name: materialization-work
        valueSerializer: json
        keySelector:
          python: |
            def select_key(value):
                return value.get("key")
        valueSelector:
          python: |
            def select_value(value):
                return value["value"]
        headersSelector:
          python: |
            def select_headers(value):
                return value.get("headers", {})
        predicate:
          python: |
            def should_send(value):
                return value is not None and value.get("route") == "work"
      - name: materializer-control-plane-schedule-requests
        valueSerializer: json
        keySelector:
          python: |
            def select_key(value):
                return value.get("key")
        valueSelector:
          python: |
            def select_value(value):
                return value["value"]
        headersSelector:
          python: |
            def select_headers(value):
                return value.get("headers", {})
        predicate:
          python: |
            def should_send(value):
                return value is not None and value.get("route") == "scheduler"
  processors:
    pipeline:
      - select-observation-work
      - execute-observation
    init:
      python: |
        from datetime import UTC, datetime

        from midstream.handlers import resource_observation as resource_observation_handler
        from midstream.kubernetes import KubernetesKasprAppClient

        kaspr_app_client = KubernetesKasprAppClient()

        def current_timestamp():
            return datetime.now(tz=UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
    operations:
      - name: select-observation-work
        filter:
          entrypoint: select_observation_work
          python: |
            def select_observation_work(value):
                return value.get("step") in {"observe_runtime", "sweep_observations"}
      - name: execute-observation
        tables:
          - name: state
            paramName: control_plane_table
          - name: settings
            paramName: settings_table
        map:
          entrypoint: execute_observation
          python: |
            # Async so the KasprApp is read on the Kubernetes client's own thread, under its deadline:
            # a sync map runs on the event loop that also serves the API, which a slow or unreachable
            # API server would stall. Return the handler's generator as-is; Kaspr cannot iterate an
            # async generator here.
            async def execute_observation(value, control_plane_table, settings_table):
                return await resource_observation_handler.handle_observation_work_for_output_async(
                    value,
                    control_plane_table,
                    kaspr_app_client,
                    observed_at=current_timestamp(),
                    settings_table=settings_table,
                )