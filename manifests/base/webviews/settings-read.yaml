apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: settings-read
  namespace: kafka-sql
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: settings-read
  description: Report one scope's settings with their effective values, where each comes from, and the deployment's fixed settings.
  request:
    method: GET
    path: /settings/{scope}
  processors:
    pipeline:
      - read-settings
    operations:
      - name: read-settings
        tables:
          - name: settings
            paramName: settings_table
          - name: state
            paramName: control_plane_table
          - name: directory
            paramName: directory_table
        map:
          entrypoint: read_settings
          python: |
            from materializer_control_plane.identity.authorization import authorize
            from materializer_control_plane.web.settings import settings_scope_view

            def read_settings(request, scope, settings_table, control_plane_table, directory_table):
                authorize(request, directory_table, "settings.view")
                return settings_scope_view(
                    settings_table,
                    scope,
                    control_plane_table=control_plane_table,
                )
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
