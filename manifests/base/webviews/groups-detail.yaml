apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: groups-detail
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: groups-detail
  description: "Return one group: its roles, the permissions they grant, and its members."
  request:
    method: GET
    path: /groups/{group_id}
  processors:
    pipeline:
      - get-group
    operations:
      - name: get-group
        tables:
          - name: directory
            paramName: directory_table
        map:
          entrypoint: get_group
          python: |
            from materializer_control_plane.identity.authorization import authorize
            from materializer_control_plane.web.identity import get_group_view

            def get_group(request, group_id, directory_table):
                principal = authorize(request, directory_table, "groups.view")
                return get_group_view(directory_table, principal, group_id)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
