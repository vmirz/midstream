apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: datasets-table
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: datasets-table
  description: "Resolve dataset.table to its table and materialization; where it is and its metadata only for a caller who may read the dataset."
  request:
    method: GET
    path: /datasets/{dataset}/tables/{table}
  processors:
    pipeline:
      - get-dataset-table
    operations:
      - name: get-dataset-table
        tables:
          - name: directory
            paramName: directory_table
          - name: state
            paramName: control_plane_table
        map:
          entrypoint: get_dataset_table
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.datasets import get_dataset_table_view

            def get_dataset_table(request, dataset, table, directory_table, control_plane_table):
                principal = authorize(request, directory_table, "datasets.view")
                return get_dataset_table_view(directory_table, control_plane_table, principal, dataset, table)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
