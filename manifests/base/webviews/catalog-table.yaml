apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: catalog-table
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: catalog-table
  description: "Iceberg REST catalog: load a table - its metadata location and metadata (HEAD answers whether it exists)."
  request:
    method: GET
    path: /catalog/v1/namespaces/{namespace}/tables/{table}
  processors:
    pipeline:
      - handle
    operations:
      - name: handle
        tables:
          - name: state
            paramName: control_plane_table
          - name: directory
            paramName: directory_table
          - name: settings
            paramName: settings_table
        map:
          entrypoint: handle
          python: |
            from materializer_control_plane.identity.authorization import authorize
            from materializer_control_plane.web.catalog import catalog_errors, catalog_load_table_view

            async def handle(request, namespace, table, control_plane_table, directory_table, settings_table):
                with catalog_errors():
                    principal = authorize(request, directory_table, "catalog.read", any_dataset=True)
                return await catalog_load_table_view(
                    namespace,
                    table,
                    control_plane_table,
                    directory_table=directory_table,
                    principal=principal,
                    settings_table=settings_table,
                )
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
