apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: auth-sessions
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: auth-sessions
  description: "List the caller's sessions, marking the one making the request."
  request:
    method: GET
    path: /auth/sessions
  processors:
    pipeline:
      - read-sessions
    operations:
      - name: read-sessions
        tables:
          - name: directory
            paramName: directory_table
        map:
          entrypoint: read_sessions
          python: |
            from midstream.web.auth import my_sessions_view

            def read_sessions(request, directory_table):
                return my_sessions_view(directory_table, request)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
