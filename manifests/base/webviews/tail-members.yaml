apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: tail-members
  namespace: kafka-sql
  labels:
    kaspr.io/app: materializer-tail
spec:
  name: tail-members
  description: "Which member of the tail app holds which tick partition, and with ?health=true each member's health."
  request:
    method: GET
    path: /tail/v1/members
  processors:
    pipeline:
      - answer
    operations:
      - name: answer
        map:
          entrypoint: answer
          python: |
            from materializer_control_plane.tail_app.handlers import tail_members

            async def answer(request):
                # Authorizes the caller first, through the control plane: the console's credential,
                # and "materializations.view_details" (tail_app/auth.py::authorize_tail).
                return await tail_members(request)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
