apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: users-sign-out
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: users-sign-out
  description: "End one of a person's sessions, or all of them."
  request:
    method: POST
    path: /users/{user_id}/sign-out
  processors:
    pipeline:
      - prepare-request
      - send-identity-request
      - return-response
    operations:
      - name: prepare-request
        tables:
          - name: directory
            paramName: directory_table
        map:
          entrypoint: prepare_request
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import json_body
            from midstream.web.identity import sign_out_user_request

            async def prepare_request(request, user_id, directory_table):
                principal = authorize(request, directory_table, "users.manage")
                body = await json_body(request, optional=True)
                return sign_out_user_request(directory_table, principal, user_id, body, request=request).to_value()
      - name: send-identity-request
        topicSend:
          name: materializer-identity-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
