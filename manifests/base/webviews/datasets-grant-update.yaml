apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: datasets-grant-update
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: datasets-grant-update
  description: "Set the roles a person or a group holds on a dataset - none removes their grant - and emit the request the identity agent applies."
  request:
    method: PUT
    path: /datasets/{dataset}/grants/{principal_id}
  processors:
    pipeline:
      - prepare-request
      - send-identity-request
      - return-response
    operations:
      - name: prepare-request
        tables:
          - name: directory
            paramName: directory_table
        map:
          entrypoint: prepare_request
          python: |
            from materializer_control_plane.identity.authorization import authorize
            from materializer_control_plane.web.http import json_body
            from materializer_control_plane.web.datasets import set_dataset_grant_request

            async def prepare_request(request, dataset, principal_id, directory_table):
                principal = authorize(request, directory_table, "dataset.manage", dataset=dataset)
                body = await json_body(request)
                return set_dataset_grant_request(directory_table, principal, dataset, principal_id, body, request=request).to_value()
      - name: send-identity-request
        topicSend:
          name: materializer-identity-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from materializer_control_plane.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
