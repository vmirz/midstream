apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: auth-refresh
  namespace: kafka-sql
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: auth-refresh
  description: "Renew the caller's session so its idle timeout starts again, never past its maximum length."
  request:
    method: POST
    path: /auth/refresh
  processors:
    pipeline:
      - refresh-session
      - send-identity-request
      - return-response
    operations:
      - name: refresh-session
        tables:
          - name: directory
            paramName: directory_table
          - name: settings
            paramName: settings_table
        map:
          entrypoint: refresh_request
          python: |
            from materializer_control_plane.web.auth import refresh_session

            def refresh_request(request, directory_table, settings_table):
                return refresh_session(directory_table, request, settings_table=settings_table).to_value()
      - name: send-identity-request
        topicSend:
          name: materializer-identity-requests
          passThrough: true
          valueSerializer: json
          predicate:
            python: |
              def has_request(value):
                  return value.get("request_event") is not None
          keySelector:
            python: |
              def select_key(value):
                  from materializer_control_plane.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return {"status": value["status"], "body": value["body"]}
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return data["status"]
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data["body"]
