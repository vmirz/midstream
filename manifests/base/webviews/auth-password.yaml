apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: auth-password
  namespace: kafka-sql
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: auth-password
  description: "Replace the caller's password, given their current one; every session of theirs then ends."
  request:
    method: POST
    path: /auth/password
  processors:
    pipeline:
      - prepare-request
      - send-identity-request
      - return-response
    operations:
      - name: prepare-request
        tables:
          - name: directory
            paramName: directory_table
          - name: settings
            paramName: settings_table
        map:
          entrypoint: prepare_request
          python: |
            from materializer_control_plane.web.auth import change_password
            from materializer_control_plane.web.http import json_body

            async def prepare_request(request, directory_table, settings_table):
                body = await json_body(request)
                acceptance = await change_password(directory_table, request, body, settings_table=settings_table)
                return {"response": acceptance.response, "request_event": acceptance.request_event.to_dict()}
      - name: send-identity-request
        topicSend:
          name: materializer-identity-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from materializer_control_plane.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
