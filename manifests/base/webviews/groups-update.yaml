apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: groups-update
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: groups-update
  description: "Rename a group, change its roles, or add and remove members, and emit the request the identity agent applies."
  request:
    method: PATCH
    path: /groups/{group_id}
  processors:
    pipeline:
      - prepare-request
      - send-identity-request
      - return-response
    operations:
      - name: prepare-request
        tables:
          - name: directory
            paramName: directory_table
        map:
          entrypoint: prepare_request
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import json_body
            from midstream.web.identity import update_group_request

            async def prepare_request(request, group_id, directory_table):
                principal = authorize(request, directory_table, "groups.manage")
                body = await json_body(request)
                return update_group_request(directory_table, principal, group_id, body, request=request).to_value()
      - name: send-identity-request
        topicSend:
          name: materializer-identity-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
