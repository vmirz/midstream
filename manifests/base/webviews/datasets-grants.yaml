apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: datasets-grants
  namespace: kafka-sql
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: datasets-grants
  description: "Return who may use a dataset and with which roles, and the roles the caller can grant on it."
  request:
    method: GET
    path: /datasets/{dataset}/grants
  processors:
    pipeline:
      - list-dataset-grants
    operations:
      - name: list-dataset-grants
        tables:
          - name: directory
            paramName: directory_table
        map:
          entrypoint: list_dataset_grants
          python: |
            from materializer_control_plane.identity.authorization import authorize
            from materializer_control_plane.web.datasets import list_dataset_grants_view

            def list_dataset_grants(request, dataset, directory_table):
                principal = authorize(request, directory_table, "dataset.manage", dataset=dataset)
                return list_dataset_grants_view(directory_table, principal, dataset)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
