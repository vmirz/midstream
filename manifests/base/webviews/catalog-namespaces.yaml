apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: catalog-namespaces
  namespace: midstream
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: catalog-namespaces
  description: "Iceberg REST catalog: list namespaces, one per materialization."
  request:
    method: GET
    path: /catalog/v1/namespaces
  processors:
    pipeline:
      - handle
    operations:
      - name: handle
        tables:
          - name: state
            paramName: control_plane_table
          - name: directory
            paramName: directory_table
          - name: settings
            paramName: settings_table
        map:
          entrypoint: handle
          python: |
            from materializer_control_plane.identity.authorization import authorize
            from materializer_control_plane.web.http import query_params
            from materializer_control_plane.web.catalog import catalog_errors, catalog_namespaces_view

            def handle(request, control_plane_table, directory_table, settings_table):
                with catalog_errors():
                    principal = authorize(request, directory_table, "catalog.read", any_dataset=True)
                return catalog_namespaces_view(
                    control_plane_table,
                    directory_table=directory_table,
                    principal=principal,
                    parent=query_params(request).get("parent"),
                    settings_table=settings_table,
                )
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
