apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: roles-detail
  namespace: kafka-sql
  labels:
    kaspr.io/app: materializer-control-plane
spec:
  name: roles-detail
  description: "Return one role with every permission it grants once implications are added."
  request:
    method: GET
    path: /roles/{role_id}
  processors:
    pipeline:
      - get-role
    operations:
      - name: get-role
        tables:
          - name: directory
            paramName: directory_table
        map:
          entrypoint: get_role
          python: |
            from materializer_control_plane.identity.authorization import authorize
            from materializer_control_plane.web.identity import get_role_view

            def get_role(request, role_id, directory_table):
                principal = authorize(request, directory_table, "roles.view")
                return get_role_view(directory_table, principal, role_id)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
