# The maintenance app: compaction, snapshot expiry and orphan cleanup of every materialization's
# tables, off the runtimes, so only this app is sized for compaction's memory. The control plane
# ticks every maintained table each minute on `materializer-maintenance-requests`, keyed by table;
# each member maintains the tables of its partitions, a job at a time by default.
apiVersion: kaspr.io/v1alpha1
kind: KasprApp
metadata:
  name: materializer-maintenance
  namespace: midstream
  labels:
    app.kubernetes.io/name: materializer-maintenance
spec:
  replicas: 1
  bootstrapServers: crs-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  authentication:
    type: scram-sha-512
    username: materializer-control-plane-user
    passwordSecret:
      secretName: materializer-control-plane-user
      passwordKey: password
  storage:
    type: persistent-claim
    class: default
    size: 1Gi
    deleteClaim: True
  config:
    valueSerializer: json
    topicAllowDeclare: true
  # A compaction child holds about its memory budget plus a row group (~1.3 GiB measured on a
  # 30-day backlog, E13); the member itself needs little besides.
  resources:
    requests:
      cpu: 0.5
      memory: 1Gi
    limits:
      cpu: 2
      memory: 3Gi
  # The CPU request follows use, resized in place; the limits stay the ceilings and memory stays as
  # set, for compaction's peaks (handbook 02 §2.10c).
  verticalPodAutoscaler:
    enabled: true
    updateMode: InPlaceOrRecreate
    controlledResources: [cpu]
    controlledValues: RequestsOnly
    minAllowed:
      cpu: 100m
    maxAllowed:
      cpu: 1500m
  pythonPackages:
    packages:
      - git+https://github.com/vmirz/midstream.git@main#egg=materializer-control-plane&subdirectory=python
    installPolicy:
      retries: 3
      timeout: 600
      onFailure: block
  template:
    pod:
      nodeSelector:
        app: sipapi
      tolerations:
        - effect: NoSchedule
          key: app
          operator: Equal
          value: twmapp
      volumes:
        - name: github-ssh
          secret:
            defaultMode: 256
            secretName: github-deploy-key
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
        - name: gcp-credentials
          secret:
            secretName: kafka-materializer-gcp-credentials
            items:
              - key: google_application_credentials.json
                path: google_application_credentials.json
    pythonPackagesInitContainer:
      env:
        - name: GIT_SSH_COMMAND
          value: >-
            ssh -i /var/run/secrets/github-ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="/tmp/github_known_hosts /var/run/secrets/github-ssh/known_hosts"
            -o StrictHostKeyChecking=accept-new
      volumeMounts:
        - name: github-ssh
          mountPath: /var/run/secrets/github-ssh
          readOnly: true
    kasprContainer:
      env:
        # Names the member in its table events, and so in the console.
        - name: MATERIALIZER_RUNTIME_MEMBER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Names the app in its commits' snapshot summaries and its table events.
        - name: MATERIALIZER_MAINTENANCE_APP_NAME
          value: materializer-maintenance
        # Compactions and orphan cleanups one member runs at once, across all its tables.
        - name: MATERIALIZER_MAINTENANCE_MAX_CONCURRENT_JOBS
          value: "1"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/gcp/google_application_credentials.json
        - name: MATERIALIZER_PROTOCOL_LOGGING_ENABLED
          value: "true"
      volumeMounts:
        - name: gcp-credentials
          mountPath: /app/gcp
          readOnly: true
