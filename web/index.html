<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Real-time console for the Kafka materializer control plane." />
    <title>Materializer Console</title>
    <script>
      // Applied before first paint so the theme never flashes.
      (() => {
        const stored = localStorage.getItem('console.theme');
        const dark = stored === 'dark' || (stored === null && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
