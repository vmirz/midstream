# Midstream: the control plane, the maintenance app, the tail app and the console, on Kaspr.
#
# Every resource, topic and table is named after the release: <release>-control-plane,
# <release>-maintenance-requests, <release>-state, and so on, so one namespace can hold several
# installations and nothing in the chart carries a fixed name. `fullnameOverride` replaces the
# release name in every derived name. The handbook (docs/handbook/02-deployment-and-manifests.md)
# explains each resource; docs/install.md walks through a first installation.

fullnameOverride: ""

# The domain this release is: one Midstream deployment, with its control plane, apps, lake prefix and
# directory (docs/handbook/20-domains-and-the-shared-console.md). The id is a URL segment
# (`/d/<id>/`), a catalog in SQL (`<id>.<dataset>.<table>`) and a namespace level of the federated
# catalog: a letter, then up to 31 lowercase letters, digits or underscores. Empty takes the release
# name with `-` read as `_`. The name is what people see; empty takes the id.
domain:
  id: ""
  name: ""

# The Python package every Kaspr app installs when its pod starts (handbook 02 §2.3). `index`, the
# default, installs the release this chart belongs to, `midstream-platform==<appVersion>`, from PyPI or
# the index given; `git` installs this repository at `ref`, for development.
package:
  source: index
  git:
    repository: https://github.com/vmirz/midstream.git
    ref: main
  index:
    version: ""              # the release to install; empty takes the chart's appVersion
    url: ""                  # an index other than PyPI
    extraUrls: []
    credentialsSecret: ""    # a Secret with `username` and `password` for a private index
  installPolicy:
    retries: 3
    timeout: 600
    onFailure: block
  # Kaspr's shared package cache, a PersistentVolumeClaim per app (`pythonPackages.cache`), for
  # example {size: 1Gi, storageClass: fast}. Empty takes the operator's defaults.
  cache: {}

kaspr:
  version: ""                # the Kaspr image version; empty takes the operator's default
  bootstrapServers: ""       # required: the Kafka bootstrap address every app and runtime uses
  # Required: Kaspr's Kafka client authentication, the same for every app and runtime. The type is
  # scram-sha-512, scram-sha-256 or plain, with the password in a Secret:
  #   authentication:
  #     type: scram-sha-512
  #     username: midstream
  #     passwordSecret: {secretName: midstream-kafka, passwordKey: password}
  authentication: {}
  # TLS to the brokers, passed to every app and runtime as the KasprApp's `tls`: `{}` turns it on
  # (SASL_SSL with authentication, SSL with `{type: plain}` alone). Unset: no TLS.
  # tls: {}
  # Kaspr settings every app and runtime share, as the KasprApp CRD's `config` spells them: for
  # example `topicReplicationFactor: 1` on a cluster with fewer than three brokers (Kaspr's default
  # is 3). The keys the chart relies on (serializers, topic declaration, the scheduler, the web port)
  # stay the chart's.
  config: {}
  storageClass: ""           # for every persistent claim; empty takes the cluster's default
  # Where every Kaspr pod is placed, the runtimes included: a node selector, tolerations for
  # tainted nodes, and affinity, as Kubernetes spells them. Each app below, and the runtimes, may
  # set their own instead; empty means these.
  nodeSelector: {}
  tolerations: []
  affinity: {}

gcs:
  # A Secret holding a service-account key under `credentialsKey`. Every app and runtime mounts it
  # and reads it through GOOGLE_APPLICATION_CREDENTIALS. Empty: the pods use application default
  # credentials, for example workload identity.
  credentialsSecret: ""
  credentialsKey: google_application_credentials.json

auth:
  # The Secret with `signing-key`, `previous-signing-key`, `service-token`, `federation-key`,
  # `previous-federation-key`, `protection-key`, `bootstrap-admin-email` and `bootstrap-admin-password`
  # (handbook 18 §18.11). Empty names <release>-auth. Every key is optional to Kubernetes, but without
  # `signing-key` nobody can sign in, without `federation-key` no access token can be made or used,
  # and without `protection-key` nothing can be hashed, so creates that would hash are refused
  # (handbook 22; `kubectl patch` it in, as handbook 16 §16.16 shows).
  # `federation-key` must be the same in every domain: access tokens are signed with it, and every
  # domain accepts a token any domain made (handbook 20).
  existingSecret: ""
  # Single sign-on this domain accepts (handbook 18 §18.17). The shared console runs the sign-in and
  # every domain checks what it hands over itself, so each provider's identity is set here too and
  # must match the console's own (`console.sso`); an empty value here takes the console's, in a
  # release that has both. A provider is offered once it is enabled here and in the console.
  sso:
    entra:                      # Microsoft Entra ID: one tenant
      enabled: false
      tenantId: ""
      clientId: ""
    github:                     # GitHub: the console's OAuth App. The client secret is needed here
      enabled: false            # too: it is how a domain checks that a token was issued to that App.
      clientId: ""
      clientSecretSecret: {}    # {name: <Secret>, key: <key>}; empty takes console.sso.github's
    google:
      enabled: false
      clientId: ""
      hostedDomains: []         # Google Workspace domains accepted (the `hd` claim); empty: any account
    oidc:                       # any other OpenID Connect provider: Dex, Okta, Keycloak, Auth0
      enabled: false
      issuer: ""                # https://idp.example.com, whose /.well-known/openid-configuration is read
      clientId: ""
      label: ""                 # the button: "Sign in with <label>"; empty: "Sign in with SSO"
      # Whether a provider's email counts as verified without an `email_verified` claim: some
      # issuers vouch for every email they put in a token and leave the claim out.
      trustEmails: false
    # What this domain does the first time someone it has never seen signs in through a provider:
    # `open` makes them an account in All Users, `invited` refuses them until an administrator adds
    # one. Adjustable later on the Settings page (Sign-in).
    firstSignIn: open
    allowedEmailDomains: []     # e.g. [example.com]; empty: any. Adjustable later on the Settings page
  # Whether people may sign in with a password here. Accounts holding the Administrator role always
  # may, so the bootstrap administrator can get in. Adjustable later on the Settings page.
  passwordSignIn: true

controlPlane:
  # The domain's control plane, its agents, tasks, tables, views and Role. Off, the release deploys
  # the shared console alone (with console.domains naming every domain), and nothing else.
  enabled: true
  replicas: 1
  webPort: 6065
  nodeSelector: {}              # empty: kaspr.nodeSelector
  tolerations: []               # empty: kaspr.tolerations
  affinity: {}                  # empty: kaspr.affinity
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 0.5
      memory: 512Mi
    limits:
      cpu: 1
      memory: 512Mi
  # The CPU request follows use, resized in place; the limits stay the ceilings and the ceiling
  # stays under the CPU limit, so the pod never turns Guaranteed (handbook 02 §2.10c).
  verticalPodAutoscaler:
    enabled: true
    updateMode: InPlaceOrRecreate
    controlledResources: [cpu]
    controlledValues: RequestsOnly
    minAllowed:
      cpu: 100m
    maxAllowed:
      cpu: 900m
  # The settings a deployment fixes (handbook 03 §3.2, 17 §17.3); each is CONTROL_PLANE_<KEY>.
  settings:
    defaultDestinationUri: ""   # gs://bucket/path the tables go under; set here or on the Settings page
    storagePrefix: ""           # the directory under the destination; empty takes the release name
    runtimeNamePrefix: ""       # runtimes are <prefix>-<materialization id>; empty takes the release name
    runtimeTemplateVersion: v1
    defaultListLimit: "30"
    deletedRetentionHours: "168"
    defaultRuntimeStorageSize: 64Mi
    defaultRuntimeReplicas: "1"
  protocolLogging: true
  extraEnv: []                  # more entries for the container's env
  # The spec every materialization's runtime is rendered from (handbook 02 §2.3, 10 §10.1): the
  # control plane sets each runtime's replicas, storage size and package pin on top of it.
  runtime:
    nodeSelector: {}            # where every runtime member runs; empty: kaspr.nodeSelector
    tolerations: []             # empty: kaspr.tolerations
    affinity: {}                # empty: kaspr.affinity
    resources:
      requests:
        cpu: 0.5
        memory: 1Gi
      limits:
        cpu: 2
        memory: 1Gi
    verticalPodAutoscaler:
      enabled: true
      updateMode: InPlaceOrRecreate
      controlledResources: [cpu]
      controlledValues: RequestsOnly
      minAllowed:
        cpu: 100m
      maxAllowed:
        cpu: 1500m
    # The runtime's own Kaspr settings; they win over kaspr.config. The writer reads its records as
    # JSON, so the serializer is spelled out rather than left to Kaspr's default.
    config:
      valueSerializer: json
      topicAllowDeclare: true
      brokerRebalanceTimeout: 300
    protocolLogging: true
    extraEnv: []

# Compaction, snapshot expiry and orphan cleanup of every table (handbook 02 §2.10a): always deployed,
# since tables left unmaintained grow small files and old snapshots without end.
maintenance:
  enabled: true                 # deployed only with the control plane
  replicas: 1
  nodeSelector: {}              # empty: kaspr.nodeSelector
  tolerations: []               # empty: kaspr.tolerations
  affinity: {}                  # empty: kaspr.affinity
  requestPartitions: 6          # bounds the members that share the tables; changing it moves every table
  maxConcurrentJobs: 1
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 0.5
      memory: 1Gi
    limits:
      cpu: 2
      memory: 3Gi
  verticalPodAutoscaler:
    enabled: true
    updateMode: InPlaceOrRecreate
    controlledResources: [cpu]
    controlledValues: RequestsOnly
    minAllowed:
      cpu: 100m
    maxAllowed:
      cpu: 1500m
  protocolLogging: true
  extraEnv: []

# The live tail: each watched table's newest records, served to the console (handbook 19).
tail:
  enabled: true                 # deployed only with the control plane
  replicas: 2
  webPort: 6065
  nodeSelector: {}              # empty: kaspr.nodeSelector
  tolerations: []               # empty: kaspr.tolerations
  affinity: {}                  # empty: kaspr.affinity
  requestPartitions: 64         # bounds the members and routes the tables; changing it moves every table
  memoryBudgetBytes: 2684354560
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  verticalPodAutoscaler:
    enabled: true
    updateMode: InPlaceOrRecreate
    controlledResources: [cpu]
    controlledValues: RequestsOnly
    minAllowed:
      cpu: 100m
    maxAllowed:
      cpu: 1500m
  protocolLogging: true
  extraEnv: []

# The shared console (console/docs): one URL for every domain. It reaches each domain's control plane
# and tail app through their Services (this release's) or their API hostnames (another cluster's), and
# reads every domain's tables with the GCS credentials above: one read-only identity for every bucket.
console:
  enabled: true
  # The URL people use, without a trailing slash: the providers send people back to
  # <url>/api/auth/sso/<provider>/callback, and the old hostnames redirect to <url>/d/<domain>/.
  # Empty takes https://<the first of route.consoleHostnames, or ingress.consoleHost>.
  url: ""
  # The domains this console serves (handbook 20). Empty: this release's domain alone. Each entry:
  #   id, name          as the domain's own release sets them (its domain.id and domain.name)
  #   local: true       this release's control plane and tail app, reached by their Services
  #   controlPlaneUrl   another domain's API: https://<its route.hostnames[0]>
  #   tailUrl           its tail app; usually the same host, whose /tail/ goes to the tail app.
  #                     Empty: that domain shows committed rows only
  #   serviceTokenSecret: {name, key}   a Secret here holding that domain's `service-token`
  #   settingsHome: true  exactly one domain stores the console's own settings
  domains: []
  # The OAuth clients the console signs people in with. Register each with the redirect URI
  # <url>/api/auth/sso/<provider>/callback. Every domain must accept the same client (auth.sso).
  sso:
    entra:
      enabled: false
      tenantId: ""
      clientId: ""
      clientSecretSecret: {}    # {name: <Secret>, key: <key>}
    github:
      enabled: false
      clientId: ""
      clientSecretSecret: {}
    google:
      enabled: false
      clientId: ""
      clientSecretSecret: {}
      hostedDomain: ""          # a hint for Google's account chooser; domains check `hd` themselves
    oidc:
      enabled: false
      issuer: ""
      clientId: ""
      clientSecretSecret: {}
      label: ""
      scopes: [openid, email, profile]
  image:
    # A commit between releases: ghcr.io/vmirz/midstream-console-dev, tag sha-<commit>, with
    # package.source git at the same commit (handbook 16 §16.3).
    repository: ghcr.io/vmirz/midstream-console
    tag: ""                     # empty takes the chart's appVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  port: 8787
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  # CONSOLE_* variables (console/docs/03-configuration-reference.md). The chart sets PORT, HOST,
  # CONSOLE_URL, CONSOLE_DOMAINS_FILE, the domains' service tokens, the sign-in clients and
  # CONSOLE_DATA_DIR itself.
  env: {}
  hmacSecret: ""                # a Secret with CONSOLE_GCS_HMAC_KEY_ID and CONSOLE_GCS_HMAC_SECRET: direct gs:// scans
  persistence:
    enabled: false              # keep the Parquet cache across restarts
    size: 10Gi
    storageClass: ""
  # The console is not a Kaspr pod and does not follow kaspr.*: place it here.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP

# How people, engines and other clusters' consoles reach the deployment, off by default: Gateway API
# HTTPRoutes or Ingresses (handbook 02 §2.12, 20).
#   hostnames         this domain's API: the control plane's views and its Iceberg catalog, and /tail/
#                     for the tail app. A console in another cluster reaches the domain here.
#   consoleHostnames  the shared console, where console.enabled: its pages, /api and /catalog
#   redirectFrom      old person-facing hostnames, sent on to <console.url>/d/<domain.id>/<path>
route:
  enabled: false
  hostnames: []
  consoleHostnames: []
  redirectFrom: []
  parentRefs: []                # for example [{name: ingress-gateway, namespace: istio-system, sectionName: https}]
# The same with an Ingress. Its redirects use ingress-nginx's annotation; with another controller, add
# the rule by hand (handbook 20 has examples for Gateway API, nginx, Istio, Traefik and HAProxy).
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""                      # this domain's API
  consoleHost: ""               # the shared console
  redirectFrom: []
  tls: []

rbac:
  create: true                  # the Role the control plane needs to create runtimes

tables:
  partitions: 3                 # the control plane's four global tables
