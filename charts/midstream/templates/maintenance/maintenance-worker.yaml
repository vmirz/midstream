{{- if include "midstream.maintenanceEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprAgent
metadata:
  name: {{ include "midstream.fullname" . }}-maintenance-worker
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.maintenance" . }}
spec:
  description: Take the control plane's ticks, requests and cancels for the tables this member maintains.
  # Keyed by table, so each table is one member's; the partitions bound how many members share them.
  input:
    topic:
      name: {{ include "midstream.fullname" . }}-maintenance-requests
      valueSerializer: json
      partitions: {{ .Values.maintenance.requestPartitions }}
    declare: true
  output:
    topics:
      - name: {{ include "midstream.fullname" . }}-materialization-table-events
        valueSerializer: json
        keySelector:
          python: |
            def select_key(value):
                return value.get("key")
        valueSelector:
          python: |
            def select_value(value):
                return value["value"]
        predicate:
          python: |
            def should_send(value):
                return isinstance(value, dict) and value.get("route") == "events"
  processors:
    pipeline:
      - take-message
    init:
      python: |
        from midstream.maintenance_app.handlers import handle_maintenance_message
    operations:
      - name: take-message
        map:
          entrypoint: take
          python: |
            # Answers at once: the jobs run on the maintenance-step task. Returns a plain generator
            # of the table events the message settles.
            def take(value):
                return handle_maintenance_message(value)
{{- end }}
