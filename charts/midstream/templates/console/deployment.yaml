{{- if .Values.console.enabled }}
{{- $domains := include "midstream.consoleDomains" . | fromJsonArray }}
{{- $storage := include "midstream.consoleStorage" . | fromJsonArray }}
# The console's registries: its domains (handbook 20), who they are and how to reach each, and its
# storage profiles (console.storage), which destination prefix is read how. Credentials come from
# Secrets, as CONSOLE_DOMAIN_<ID>_SERVICE_TOKEN and CONSOLE_STORAGE_<NAME>_* below, never from here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "midstream.console" . }}-domains
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
data:
  domains.json: |
    {{- $domains | toPrettyJson | nindent 4 }}
  storage.json: |
    {{- $storage | toPrettyJson | nindent 4 }}
---
# The console's own ServiceAccount: the cloud identity a storage profile without a Secret reads as, given
# by console.serviceAccountAnnotations (IRSA's role, AKS workload identity's client id).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "midstream.console" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.console.serviceAccountAnnotations }}
  annotations:
    {{- include "midstream.metadataMap" (dict "map" . "what" "console.serviceAccountAnnotations") | trim | nindent 4 }}
  {{- end }}
---
# The shared console (console/docs): a Node backend-for-frontend and a React client in one process.
# It reaches every domain's control plane and tail app, reads every domain's tables through its
# storage profiles, and holds a browser's sessions, one per domain, in cookies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "midstream.console" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: midstream
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "midstream.labels" . | nindent 8 }}
        app.kubernetes.io/component: console
        {{- with .Values.console.podLabels }}
        {{- include "midstream.metadataMap" (dict "map" . "what" "console.podLabels" "root" $) | trim | nindent 8 }}
        {{- end }}
      annotations:
        # A change of domains or storage profiles restarts the console, which reads them once.
        checksum/domains: {{ $domains | toJson | sha256sum }}
        checksum/storage: {{ $storage | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ include "midstream.console" . }}
      {{- with .Values.console.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image runs as node (uid 1000); the group lets it write its cache volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ default .Chart.AppVersion .Values.console.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PORT
              value: {{ .Values.console.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            # The URL people use: the providers' redirect URIs and the redirects from old hostnames.
            - name: CONSOLE_URL
              value: {{ include "midstream.consoleUrl" . | quote }}
            - name: CONSOLE_DOMAINS_FILE
              value: /etc/midstream/domains.json
            # The storage profiles: which destination prefix is read with which credentials.
            - name: CONSOLE_STORAGE_FILE
              value: /etc/midstream/storage.json
            # Each domain's service token: the console reads its live views with it.
            {{- range $domains }}
            - name: {{ include "midstream.domainTokenEnv" .id }}
              valueFrom:
                secretKeyRef:
                  {{- if .local }}
                  name: {{ include "midstream.authSecret" $ }}
                  key: service-token
                  optional: true
                  {{- else }}
                  {{- $secret := (index $.Values.console.domains (include "midstream.domainIndex" (dict "domains" $.Values.console.domains "id" .id) | int)).serviceTokenSecret }}
                  name: {{ $secret.name }}
                  key: {{ $secret.key }}
                  {{- end }}
            {{- end }}
            {{- with (include "midstream.consoleStorageEnv" . | trim) }}
            # Each storage profile's credentials, from its Secret: every key optional.
            {{- . | nindent 12 }}
            {{- end }}
            {{- with (include "midstream.consoleSsoEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: CONSOLE_DATA_DIR
              value: /var/lib/midstream-console
            {{- range $name, $value := .Values.console.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/midstream-console
            - name: domains
              mountPath: /etc/midstream
              readOnly: true
            {{- /* A gcs profile's service-account key: beside the registries' volume, not inside it. */}}
            {{- range .Values.console.storage }}
            {{- if and (eq (toString .kind) "gcs") .credentialsSecret }}
            - name: {{ include "midstream.consoleStorageVolume" .name }}
              mountPath: /etc/midstream-storage/{{ .name }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: domains
          configMap:
            name: {{ include "midstream.console" . }}-domains
        - name: data
          {{- if .Values.console.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "midstream.console" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- range .Values.console.storage }}
        {{- if and (eq (toString .kind) "gcs") .credentialsSecret }}
        - name: {{ include "midstream.consoleStorageVolume" .name }}
          secret:
            secretName: {{ .credentialsSecret }}
            optional: true
            items:
              - key: service-account.json
                path: service-account.json
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "midstream.console" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  selector:
    app.kubernetes.io/name: midstream
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.port }}
      targetPort: http
{{- if .Values.console.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "midstream.console" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.console.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.console.persistence.size }}
{{- end }}
{{- end }}
