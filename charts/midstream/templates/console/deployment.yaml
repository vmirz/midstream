{{- if .Values.console.enabled }}
{{- $domains := include "midstream.consoleDomains" . | fromJsonArray }}
# The console's domains (handbook 20): who they are and how to reach each. Their service tokens come
# from Secrets, as CONSOLE_DOMAIN_<ID>_SERVICE_TOKEN below, never from here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "midstream.console" . }}-domains
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
data:
  domains.json: |
    {{- $domains | toPrettyJson | nindent 4 }}
---
# The shared console (console/docs): a Node backend-for-frontend and a React client in one process.
# It reaches every domain's control plane and tail app, reads every domain's tables with the GCS
# credentials, and holds a browser's sessions, one per domain, in cookies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "midstream.console" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: midstream
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "midstream.labels" . | nindent 8 }}
        app.kubernetes.io/component: console
      annotations:
        # A change of domains restarts the console, which reads them once.
        checksum/domains: {{ $domains | toJson | sha256sum }}
    spec:
      {{- with .Values.console.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image runs as node (uid 1000); the group lets it write its cache volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ default .Chart.AppVersion .Values.console.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PORT
              value: {{ .Values.console.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            # The URL people use: the providers' redirect URIs and the redirects from old hostnames.
            - name: CONSOLE_URL
              value: {{ include "midstream.consoleUrl" . | quote }}
            - name: CONSOLE_DOMAINS_FILE
              value: /etc/midstream/domains.json
            # Each domain's service token: the console reads its live views with it.
            {{- range $domains }}
            - name: {{ include "midstream.domainTokenEnv" .id }}
              valueFrom:
                secretKeyRef:
                  {{- if .local }}
                  name: {{ include "midstream.authSecret" $ }}
                  key: service-token
                  optional: true
                  {{- else }}
                  {{- $secret := (index $.Values.console.domains (include "midstream.domainIndex" (dict "domains" $.Values.console.domains "id" .id) | int)).serviceTokenSecret }}
                  name: {{ $secret.name }}
                  key: {{ $secret.key }}
                  {{- end }}
            {{- end }}
            {{- with (include "midstream.consoleSsoEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: CONSOLE_DATA_DIR
              value: /var/lib/midstream-console
            {{- include "midstream.gcsEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.console.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.console.hmacSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/midstream-console
            - name: domains
              mountPath: /etc/midstream
              readOnly: true
            {{- if .Values.gcs.credentialsSecret }}
            - name: gcp-credentials
              mountPath: /app/gcp
              readOnly: true
            {{- end }}
      volumes:
        - name: domains
          configMap:
            name: {{ include "midstream.console" . }}-domains
        - name: data
          {{- if .Values.console.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "midstream.console" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.gcs.credentialsSecret }}
        - name: gcp-credentials
          secret:
            secretName: {{ . }}
            items:
              - key: {{ $.Values.gcs.credentialsKey }}
                path: google_application_credentials.json
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "midstream.console" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  selector:
    app.kubernetes.io/name: midstream
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.port }}
      targetPort: http
{{- if .Values.console.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "midstream.console" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "midstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.console.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.console.persistence.size }}
{{- end }}
{{- end }}
