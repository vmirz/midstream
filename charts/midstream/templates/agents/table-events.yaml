apiVersion: kaspr.io/v1alpha1
kind: KasprAgent
metadata:
  name: {{ include "midstream.fullname" . }}-table-events
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  description: Applies what runtimes report about their Iceberg tables - schema changes, commits, maintenance runs and errors - to the control plane's records.
  input:
    topic:
      name: {{ include "midstream.fullname" . }}-materialization-table-events
      valueSerializer: json
    declare: true
  processors:
    pipeline:
      - apply-table-event
    init:
      python: |
        from midstream.handlers.table_events import handle_table_event
    operations:
      - name: apply-table-event
        tables:
          - name: {{ include "midstream.fullname" . }}-state
            paramName: control_plane_table
          - name: {{ include "midstream.fullname" . }}-settings
            paramName: settings_table
        map:
          entrypoint: apply_table_event
          python: |
            def apply_table_event(value, control_plane_table, settings_table):
                handle_table_event(value, control_plane_table, settings_table=settings_table)
                return value
