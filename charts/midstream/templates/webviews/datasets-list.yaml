apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-datasets-list
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: datasets-list
  description: "Return every dataset, with its owners, its tables' names and what the caller may do with it; locked ones marked."
  request:
    method: GET
    path: /datasets
  processors:
    pipeline:
      - list-datasets
    operations:
      - name: list-datasets
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: list_datasets
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import query_params
            from midstream.web.datasets import list_datasets_view

            def list_datasets(request, directory_table):
                principal = authorize(request, directory_table, "datasets.view")
                return list_datasets_view(directory_table, principal, query_params(request))
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
