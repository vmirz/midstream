{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-catalog-namespace
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: catalog-namespace
  description: "Iceberg REST catalog: a namespace - a materialization - and its properties."
  request:
    method: GET
    path: /catalog/v1/namespaces/{namespace}
  processors:
    pipeline:
      - handle
    operations:
      - name: handle
        tables:
          - name: {{ include "midstream.fullname" . }}-state
            paramName: control_plane_table
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
          - name: {{ include "midstream.fullname" . }}-settings
            paramName: settings_table
        map:
          entrypoint: handle
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.catalog import catalog_errors, catalog_namespace_view

            def handle(request, namespace, control_plane_table, directory_table, settings_table):
                with catalog_errors():
                    principal = authorize(request, directory_table, "catalog.read", any_dataset=True)
                return catalog_namespace_view(
                    namespace,
                    control_plane_table,
                    directory_table=directory_table,
                    principal=principal,
                    settings_table=settings_table,
                )
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
