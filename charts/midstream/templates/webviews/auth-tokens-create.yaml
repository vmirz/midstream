{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-auth-tokens-create
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: auth-tokens-create
  description: Make an access token for the caller, for external tools reading the Iceberg catalog; its text is returned once.
  request:
    method: POST
    path: /auth/tokens
  processors:
    pipeline:
      - prepare-request
      - send-identity-request
      - return-response
    operations:
      - name: prepare-request
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: prepare_request
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import json_body
            from midstream.web.tokens import create_access_token_request

            async def prepare_request(request, directory_table):
                # A token needs catalog.read on the datasets it is for, which the view checks.
                principal = authorize(request, directory_table, "catalog.read", any_dataset=True)
                body = await json_body(request, optional=True)
                return create_access_token_request(principal, body, request=request, directory_table=directory_table).to_value()
      - name: send-identity-request
        topicSend:
          name: {{ include "midstream.fullname" . }}-identity-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
