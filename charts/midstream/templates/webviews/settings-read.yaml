{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-settings-read
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: settings-read
  description: Report one scope's settings with their effective values, where each comes from, and the deployment's fixed settings.
  request:
    method: GET
    path: /settings/{scope}
  processors:
    pipeline:
      - read-settings
    operations:
      - name: read-settings
        tables:
          - name: {{ include "midstream.fullname" . }}-settings
            paramName: settings_table
          - name: {{ include "midstream.fullname" . }}-state
            paramName: control_plane_table
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: read_settings
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.settings import settings_scope_view

            def read_settings(request, scope, settings_table, control_plane_table, directory_table):
                authorize(request, directory_table, "settings.view")
                return settings_scope_view(
                    settings_table,
                    scope,
                    control_plane_table=control_plane_table,
                )
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
