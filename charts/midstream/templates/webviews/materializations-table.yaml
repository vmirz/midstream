{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-materializations-table
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: materializations-table
  description: Return one of a materialization's Iceberg table records - location, snapshot, totals, offsets and maintenance history.
  request:
    method: GET
    path: /materializations/{materialization_id}/tables/{table_name}
  processors:
    pipeline:
      - get-table
    operations:
      - name: get-table
        tables:
          - name: {{ include "midstream.fullname" . }}-state
            paramName: control_plane_table
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: get_table
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.materializations import get_materialization_table_view

            def get_table(request, materialization_id, table_name, control_plane_table, directory_table):
                principal = authorize(request, directory_table, "materializations.view_details")
                return get_materialization_table_view(control_plane_table, materialization_id, table_name, principal=principal)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
