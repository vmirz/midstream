{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-materializations-update
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: materializations-update
  description: Change a materialization's label, replica count or topics and emit a request event.
  request:
    method: PATCH
    path: /materializations/{materialization_id}
  processors:
    pipeline:
      - prepare-update
      - send-request-event
      - return-response
    operations:
      - name: prepare-update
        tables:
          - name: {{ include "midstream.fullname" . }}-state
            paramName: control_plane_table
          - name: {{ include "midstream.fullname" . }}-settings
            paramName: settings_table
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: prepare_update
          python: |
            from midstream.identity.authorization import authorize
            from midstream.kafka.metadata import get_metadata_client
            from midstream.web.materializations import update_materialization_async

            # Kafka is asked for the topics the change starts reading, and awaited: this loop also
            # serves every other request. The metadata client is the process's one, shared with the
            # topic views; not made in an `init`, whose names would come first in every operation's
            # scope, where return-response, with no entrypoint, would run one.
            async def prepare_update(request, materialization_id, control_plane_table, settings_table, directory_table):
                principal = authorize(request, directory_table, "materializations.edit")
                body = await request.json()
                acceptance = await update_materialization_async(
                    control_plane_table,
                    materialization_id,
                    body,
                    metadata_client=get_metadata_client(),
                    submitted_by=principal.attribution,
                    submitted_by_id=principal.user_id,
                    principal=principal,
                    directory_table=directory_table,
                    settings_table=settings_table,
                )
                return {"response": acceptance.response, "request_event": acceptance.request_event.to_dict()}
      - name: send-request-event
        topicSend:
          name: {{ include "midstream.fullname" . }}-materialization-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage import materialization_routing_key

                  return materialization_routing_key(value["request_event"]["materialization_id"])
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
