{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-system-settings
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: system-settings
  description: Report the defaults a new materialization takes, such as its destination, so clients can show them.
  request:
    method: GET
    path: /system/settings
  processors:
    pipeline:
      - read-settings
    operations:
      - name: read-settings
        tables:
          - name: {{ include "midstream.fullname" . }}-settings
            paramName: settings_table
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: read_settings
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.system import settings_view

            def read_settings(request, settings_table, directory_table):
                authorize(request, directory_table, "materializations.view")
                return settings_view(settings_table=settings_table)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
