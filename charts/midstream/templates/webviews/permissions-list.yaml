{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-permissions-list
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: permissions-list
  description: "Return the permission catalog: categories, and each permission with what it implies."
  request:
    method: GET
    path: /permissions
  processors:
    pipeline:
      - list-permissions
    operations:
      - name: list-permissions
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: list_permissions
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.identity import permissions_view

            def list_permissions(request, directory_table):
                principal = authorize(request, directory_table, None)
                return permissions_view(principal)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
