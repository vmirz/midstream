{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-materializations-maintenance
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: materializations-maintenance
  description: Ask the maintenance app to run one table maintenance job now, on one of a materialization's tables or on each; a reprotect goes through the control plane, which keeps it on each table's record until done.
  request:
    method: POST
    path: /materializations/{materialization_id}/maintenance
  processors:
    pipeline:
      - prepare-maintenance
      - send-maintenance-request
      - send-request-event
      - return-response
    operations:
      - name: prepare-maintenance
        tables:
          - name: {{ include "midstream.fullname" . }}-state
            paramName: control_plane_table
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
          - name: {{ include "midstream.fullname" . }}-settings
            paramName: settings_table
        map:
          entrypoint: prepare_maintenance
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import json_body
            from midstream.web.materializations import request_maintenance

            async def prepare_maintenance(request, materialization_id, control_plane_table, directory_table, settings_table):
                principal = authorize(request, directory_table, "materializations.maintain")
                body = await json_body(request)
                return request_maintenance(
                    control_plane_table,
                    materialization_id,
                    body,
                    submitted_by=principal.attribution,
                    submitted_by_id=principal.user_id,
                    principal=principal,
                    settings_table=settings_table,
                )
      # One message for each table the request names, keyed by the table, so the maintenance member
      # that maintains it runs the job.
      - name: send-maintenance-request
        topicSend:
          name: {{ include "midstream.fullname" . }}-maintenance-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  return value["key"]
          valueSelector:
            python: |
              def select_value(value):
                  return value["message"]
          predicate:
            python: |
              def should_send(value):
                  return value.get("route") == "maintenance"
      # A reprotect: one request event for request intake, which puts it on each table's record
      # (handbook 22 §22.14).
      - name: send-request-event
        topicSend:
          name: {{ include "midstream.fullname" . }}-materialization-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage import materialization_routing_key

                  return materialization_routing_key(value["request_event"]["materialization_id"])
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
          predicate:
            python: |
              def should_send(value):
                  return value.get("route") == "request"
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
