{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-users-list
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: users-list
  description: "List every person with their groups, status and last activity, filtered and sorted."
  request:
    method: GET
    path: /users
  processors:
    pipeline:
      - list-users
    operations:
      - name: list-users
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: list_users
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import query_params
            from midstream.web.identity import list_users_view

            def list_users(request, directory_table):
                principal = authorize(request, directory_table, "users.view")
                return list_users_view(directory_table, principal, query_params(request))
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
