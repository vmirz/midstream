{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-users-detail
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: users-detail
  description: "Return one person's account: groups, effective permissions and their sources, sessions and activity."
  request:
    method: GET
    path: /users/{user_id}
  processors:
    pipeline:
      - get-user
    operations:
      - name: get-user
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: get_user
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.identity import get_user_view

            def get_user(request, user_id, directory_table):
                principal = authorize(request, directory_table, "users.view_details")
                return get_user_view(directory_table, principal, user_id)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
