{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-auth-tokens-revocations-apply
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: auth-tokens-revocations-apply
  description: Record access token revocations another domain signed; the federation key's signature is the proof.
  request:
    method: POST
    path: /auth/tokens/revocations
  processors:
    pipeline:
      - prepare-request
      - send-identity-request
      - return-response
    operations:
      - name: prepare-request
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: prepare_request
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import json_body
            from midstream.web.tokens import apply_revocations_request

            async def prepare_request(request, directory_table):
                # Anyone may hand over a revocation: only one signed with the federation key is taken.
                authorize(request, directory_table, None)
                body = await json_body(request)
                return apply_revocations_request(body, request=request).to_value()
      - name: send-identity-request
        topicSend:
          name: {{ include "midstream.fullname" . }}-identity-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
