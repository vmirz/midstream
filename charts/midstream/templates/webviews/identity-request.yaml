{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-identity-request
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: identity-request
  description: "Report whether a change to users, groups or roles was applied, refused, or is still pending."
  request:
    method: GET
    path: /identity/requests/{request_id}
  processors:
    pipeline:
      - get-request
    operations:
      - name: get-request
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: get_request
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.identity import identity_request_view

            def get_request(request, request_id, directory_table):
                principal = authorize(request, directory_table, None, allow_password_change=True)
                return identity_request_view(directory_table, principal, request_id)
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
