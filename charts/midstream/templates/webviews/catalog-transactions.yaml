apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-catalog-transactions
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: catalog-transactions
  description: "Iceberg REST catalog: multi-table transactions are not supported."
  request:
    method: POST
    path: /catalog/v1/transactions/commit
  processors:
    pipeline:
      - handle
    operations:
      - name: handle
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
        map:
          entrypoint: handle
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.catalog import catalog_errors, catalog_not_supported_view

            def handle(request, directory_table):
                with catalog_errors():
                    authorize(request, directory_table, "catalog.read", any_dataset=True)
                return catalog_not_supported_view("transactions")
  response:
    contentType: application/json
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
