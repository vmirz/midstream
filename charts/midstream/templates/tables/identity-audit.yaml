apiVersion: kaspr.io/v1alpha1
kind: KasprTable
metadata:
  name: {{ include "midstream.fullname" . }}-identity-audit
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: identity-audit
  description: The audit log of sign-ins and changes to users, groups and roles, kept for the configured retention.
  global: true
  keySerializer: json
  valueSerializer: json
  partitions: {{ .Values.tables.partitions }}
