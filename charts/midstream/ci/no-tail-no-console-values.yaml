# No tail app and no console, installed from a package index, with an Ingress and another name.
fullnameOverride: lake
package:
  source: index
  index:
    url: https://pypi.example.com/simple
    credentialsSecret: pypi-credentials
kaspr:
  bootstrapServers: kafka:9092
  authentication:
    type: scram-sha-512
    username: lake
    passwordSecret:
      secretName: lake-kafka
      passwordKey: password
tail:
  enabled: false
console:
  enabled: false
ingress:
  enabled: true
  className: nginx
  host: lake.example.com
