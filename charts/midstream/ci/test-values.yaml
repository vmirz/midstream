# Every feature on, with the Secrets a real installation names: the shape the render tests check.
kaspr:
  bootstrapServers: kafka-bootstrap.kafka.svc.cluster.local:9092
  authentication:
    type: scram-sha-512
    username: midstream
    passwordSecret:
      secretName: midstream-kafka
      passwordKey: password
  storageClass: standard
  nodeSelector:
    workload: streaming
  tolerations:
    - key: workload
      operator: Equal
      value: streaming
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: [europe-west1-b]
gcs:
  credentialsSecret: midstream-gcs
controlPlane:
  settings:
    defaultDestinationUri: gs://example-lake/midstream
# The maintenance app on its own, compaction-sized nodes; everything else where kaspr.* says.
maintenance:
  nodeSelector:
    workload: compaction
  tolerations:
    - key: workload
      operator: Equal
      value: compaction
      effect: NoSchedule
console:
  nodeSelector:
    workload: web
  tolerations:
    - key: workload
      operator: Equal
      value: web
      effect: NoSchedule
  persistence:
    enabled: true
  hmacSecret: midstream-gcs-hmac
  env:
    CONSOLE_DUCKDB_MEMORY_LIMIT: 2GB
route:
  enabled: true
  hostnames: [midstream.example.com]
  parentRefs:
    - name: ingress-gateway
      namespace: istio-system
      sectionName: https
