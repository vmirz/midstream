# Every feature on, with the Secrets a real installation names: the shape the render tests check.
# Domain A with the shared console, which also serves Domain B in another cluster (handbook 20).
domain:
  id: domain_a
  name: Domain A
package:
  source: git              # the development source; the default installs the release from PyPI
kaspr:
  bootstrapServers: kafka-bootstrap.kafka.svc.cluster.local:9092
  authentication:
    type: scram-sha-512
    username: midstream
    passwordSecret:
      secretName: midstream-kafka
      passwordKey: password
  # A TLS listener, as the KasprApp CRD spells it.
  tls: {}
  storageClass: standard
  # Shared Kaspr settings; the chart's own keys cannot be overridden (the serializer stays json).
  config:
    topicReplicationFactor: 1
    valueSerializer: raw
  nodeSelector:
    workload: streaming
  tolerations:
    - key: workload
      operator: Equal
      value: streaming
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: [europe-west1-b]
# The lake on GCS, with a service-account key from a Secret for the apps and the runtimes.
storage:
  gcs:
    credentialsSecret: midstream-gcs
auth:
  sso:
    entra:
      enabled: true             # the tenant and client come from console.sso
    github:
      enabled: true
    google:
      enabled: true
      hostedDomains: [example.com]
    oidc:
      enabled: true
      label: Dex
    firstSignIn: invited
    allowedEmailDomains: [example.com]
  passwordSignIn: false
controlPlane:
  settings:
    defaultDestinationUri: gs://example-lake/midstream
# The maintenance app on its own, compaction-sized nodes; everything else where kaspr.* says.
maintenance:
  nodeSelector:
    workload: compaction
  tolerations:
    - key: workload
      operator: Equal
      value: compaction
      effect: NoSchedule
console:
  url: https://midstream.example.com
  domains:
    - id: domain_a
      name: Domain A
      local: true
      settingsHome: true
    - id: domain_b
      name: Domain B
      controlPlaneUrl: https://domain-b-api.example.com/
      tailUrl: https://domain-b-api.example.com
      serviceTokenSecret:
        name: domain-b-auth
        key: service-token
  sso:
    entra:
      enabled: true
      tenantId: 00000000-0000-0000-0000-000000000000
      clientId: 11111111-1111-1111-1111-111111111111
      clientSecretSecret: {name: console-sso, key: entra}
    github:
      enabled: true
      clientId: Iv1.example
      clientSecretSecret: {name: console-sso, key: github}
    google:
      enabled: true
      clientId: example.apps.googleusercontent.com
      clientSecretSecret: {name: console-sso, key: google}
      hostedDomain: example.com
    oidc:
      enabled: true
      issuer: https://dex.example.com/
      clientId: midstream
      clientSecretSecret: {name: console-sso, key: oidc}
      label: Dex
  nodeSelector:
    workload: web
  tolerations:
    - key: workload
      operator: Equal
      value: web
      effect: NoSchedule
  persistence:
    enabled: true
  # The console reads Domain A's lake with read-only credentials of its own: an HMAC key for DuckDB's
  # scans and a service-account key for the metadata.
  storage:
    - name: lake
      scope: gs://example-lake/
      kind: gcs
      credentialsSecret: midstream-lake-reader
  env:
    CONSOLE_DUCKDB_MEMORY_LIMIT: 2GB
route:
  enabled: true
  hostnames: [domain-a-api.example.com]
  consoleHostnames: [midstream.example.com]
  redirectFrom: [domain-a-midstream.example.com]
  parentRefs:
    - name: ingress-gateway
      namespace: istio-system
      sectionName: https
