# The shared console alone, in a platform cluster: every domain it serves is in another release.
controlPlane:
  enabled: false
gcs:
  credentialsSecret: lake-reader
console:
  url: https://midstream.example.com
  hmacSecret: lake-reader-hmac
  domains:
    - id: domain_a
      name: Domain A
      controlPlaneUrl: https://domain-a-api.example.com
      tailUrl: https://domain-a-api.example.com
      serviceTokenSecret: {name: domain-a-auth, key: service-token}
    - id: domain_b
      name: Domain B
      controlPlaneUrl: https://domain-b-api.example.com
      serviceTokenSecret: {name: domain-b-auth, key: service-token}
      settingsHome: true
  sso:
    oidc:
      enabled: true
      issuer: https://idp.example.com
      clientId: midstream
      clientSecretSecret: {name: console-sso, key: oidc}
ingress:
  enabled: true
  className: nginx
  consoleHost: midstream.example.com
