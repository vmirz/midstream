# The shared console alone, in a platform cluster: every domain it serves is in another release.
controlPlane:
  enabled: false
console:
  url: https://midstream.example.com
  # Domain A's lake is on GCS, Domain B's on an S3-compatible server: a read-only identity for each.
  storage:
    - name: domain-a
      scope: gs://domain-a-lake/
      kind: gcs
      credentialsSecret: domain-a-lake-reader
    - name: domain-b
      scope: s3://domain-b-lake/
      kind: s3
      endpoint: https://s3.example.com/
      region: eu-west-1
      pathStyle: true
      access: cached
      credentialsSecret: domain-b-lake-reader
  domains:
    - id: domain_a
      name: Domain A
      controlPlaneUrl: https://domain-a-api.example.com
      tailUrl: https://domain-a-api.example.com
      serviceTokenSecret: {name: domain-a-auth, key: service-token}
    - id: domain_b
      name: Domain B
      controlPlaneUrl: https://domain-b-api.example.com
      serviceTokenSecret: {name: domain-b-auth, key: service-token}
      settingsHome: true
  sso:
    oidc:
      enabled: true
      issuer: https://idp.example.com
      clientId: midstream
      clientSecretSecret: {name: console-sso, key: oidc}
ingress:
  enabled: true
  className: nginx
  consoleHost: midstream.example.com
